<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkillSwap — Creator gig marketplace</title>
<meta name="description" content="Discover creators. Book skills. Make things happen. Browse gigs, post your own, and manage bookings." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#0891b2; --accent-soft:#e0f7fb;
  --pend-bg:#fef3c7; --pend-fg:#92400e;
  --acc-bg:#dcfce7; --acc-fg:#166534;
  --dec-bg:#fee2e2; --dec-fg:#991b1b;
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(60rem 40rem at 10% -10%, #d8f3f9 0%, transparent 60%),
  radial-gradient(50rem 40rem at 100% 0%, #e6e9ff 0%, transparent 55%), var(--bg);
  font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(255,255,255,.72);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:8px;height:64px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;margin-right:auto}
.logo span{color:var(--accent)}
nav a.link{padding:8px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
nav a.link:hover{background:#fff;color:var(--ink)}
nav a.link.active{background:var(--accent-soft);color:#0e7490;font-weight:600}
.card{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px -18px rgba(15,23,42,.4)}
.hero{padding:56px 0 28px}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.05;letter-spacing:-.03em;margin:0 0 12px}
.hero p{color:var(--muted);font-size:18px;margin:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{padding:10px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 8px}
input,select,textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding-bottom:40px}
.gig{padding:20px;display:flex;flex-direction:column;gap:10px}
.gig .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#0e7490;background:var(--accent-soft);padding:5px 10px;border-radius:999px;font-weight:600}
.rate{font-weight:700}
.rate small{color:var(--muted);font-weight:500}
.gig h3{margin:0;font-size:18px;letter-spacing:-.01em}
.desc{color:var(--muted);font-size:14px;line-height:1.55;margin:0}
.creator{display:flex;align-items:center;gap:9px;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.btnrow{display:flex;gap:10px;margin-top:auto;padding-top:6px}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0e7490}
.btn.danger{color:var(--dec-fg)}
.btn.grow{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.Pending{background:var(--pend-bg);color:var(--pend-fg)}
.Accepted{background:var(--acc-bg);color:var(--acc-fg)}
.Declined{background:var(--dec-bg);color:var(--dec-fg)}
.page{padding:40px 0}
.page h2{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}
.page .sub{color:var(--muted);margin:0 0 26px}
.form{padding:24px;display:grid;gap:16px;max-width:640px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.err{color:#b91c1c;font-size:12.5px;margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{padding:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
.row .main{flex:1;min-width:240px}
.row h4{margin:0 0 4px;font-size:16px}
.meta{color:var(--muted);font-size:13.5px;line-height:1.6}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.detail{padding:28px;display:grid;gap:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.fact span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.ok{padding:36px;text-align:center;display:grid;gap:14px;justify-items:center;max-width:560px}
.tick{width:56px;height:56px;border-radius:50%;background:var(--acc-bg);color:var(--acc-fg);display:grid;place-items:center;font-size:26px}
footer{padding:30px 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:20px}
@media(max-width:560px){.two{grid-template-columns:1fr}.hero{padding:36px 0 20px}}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="#/">Skill<span>Swap</span></a>
  <a class="link" href="#/">Explore Gigs</a>
  <a class="link" href="#/post">Post a Gig</a>
  <a class="link" href="#/dashboard">Creator Dashboard</a>
  <a class="link" href="#/bookings">My Bookings</a>
</div></nav>
<main id="app"></main>
<footer><div class="wrap">SkillSwap — turn your skills into opportunities. Demo data is stored in your browser.</div></footer>

<script>
/* ---------------- data layer (localStorage) ---------------- */
var KEY="skillswap.v1", H=3600000, N=Date.now();
var CATEGORIES=["Design","Video Editing","Tutoring","Music","Writing","Social Media"];
function seed(){return{gigs:[
 {id:"g1",title:"Brand Reel, Cut in 48 Hours",creator:"Maya Rivera",category:"Video Editing",rate:180,rateUnit:"project",description:"Tight, music-driven edits that turn raw footage into a scroll-stopping story. Includes captions, colour grade, two revision rounds and vertical + horizontal exports.",createdAt:N-2*H},
 {id:"g2",title:"Logo + Brand Kit, End to End",creator:"Theo Bakker",category:"Design",rate:240,rateUnit:"project",description:"A confident mark plus colours, type and a mini guide your team can actually use. Three concepts, one full refinement round, all source files delivered.",createdAt:N-6*H},
 {id:"g3",title:"1:1 Math, High School Level",creator:"Priya Kapoor",category:"Tutoring",rate:30,rateUnit:"hour",description:"Calm, patient sessions that rebuild confidence one concept at a time. Algebra through calculus, with practice sets and exam-week pacing.",createdAt:N-20*H},
 {id:"g4",title:"Studio Session, Co-Write a Hook",creator:"Dre Lawson",category:"Music",rate:120,rateUnit:"session",description:"Sixty minutes at the desk to lock in a hook and a simple beat. You leave with a rough mix, stems and a plan for the full track.",createdAt:N-30*H},
 {id:"g5",title:"Launch Copy, One Page",creator:"Nina Sousa",category:"Writing",rate:90,rateUnit:"page",description:"Landing page words that sound like you, not a template. Headline, subheads, feature blurbs and CTA copy delivered in two drafts.",createdAt:N-44*H},
 {id:"g6",title:"30-Day Content Calendar",creator:"Omar Fadel",category:"Social Media",rate:60,rateUnit:"month",description:"A ready-to-post month mapped to your niche, with hooks, captions and a shooting schedule so you never stare at an empty grid.",createdAt:N-60*H},
 {id:"g7",title:"Podcast Cleanup & Mastering",creator:"Leo Marchetti",category:"Music",rate:75,rateUnit:"episode",description:"Noise removal, levelling and a warm master for each episode, plus an intro sting cut to your theme.",createdAt:N-80*H},
 {id:"g8",title:"Pitch Deck Redesign",creator:"Ana Duarte",category:"Design",rate:200,rateUnit:"deck",description:"Up to 15 slides restructured and restyled: clear hierarchy, consistent charts and a template you can keep extending.",createdAt:N-96*H},
 {id:"g9",title:"Physics Exam Crash Sessions",creator:"Sofia Lindqvist",category:"Tutoring",rate:35,rateUnit:"hour",description:"Focused revision for mechanics and electricity, worked problems and past-paper timing drills.",createdAt:N-120*H}
],bookings:[
 {id:"b1",gigId:"g1",clientName:"Jordan Lee",clientEmail:"jordan@launchlab.co",requirement:"Need a 30s launch teaser cut from about 20 minutes of footage.",status:"Pending",createdAt:N-H},
 {id:"b2",gigId:"g2",clientName:"Jordan Lee",clientEmail:"jordan@launchlab.co",requirement:"Rebrand for a small coffee roastery, warm and minimal.",status:"Accepted",createdAt:N-5*H},
 {id:"b3",gigId:"g4",clientName:"Jordan Lee",clientEmail:"jordan@launchlab.co",requirement:"Want help writing a chorus for an indie-pop demo.",status:"Declined",createdAt:N-26*H}
]};}
var data=(function(){try{var r=localStorage.getItem(KEY);if(!r){var s=seed();localStorage.setItem(KEY,JSON.stringify(s));return s;}
var p=JSON.parse(r);return (p&&p.gigs&&p.bookings)?p:seed();}catch(e){return seed();}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function uid(p){return p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function newestFirst(a){return a.slice().sort(function(x,y){return y.createdAt-x.createdAt;});}
function gigById(id){for(var i=0;i<data.gigs.length;i++)if(data.gigs[i].id===id)return data.gigs[i];return null;}
function fmt(ts){return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function initials(n){return n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase();}

/* ---------------- router ---------------- */
var app=document.getElementById("app");
function parse(){var h=location.hash.replace(/^#/,"")||"/";var q={},i=h.indexOf("?");
 if(i>-1){h.slice(i+1).split("&").forEach(function(kv){var p=kv.split("=");q[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||"");});h=h.slice(0,i);}
 return {path:h,q:q};}
function go(h){location.hash=h;}
function render(){
 var r=parse(),parts=r.path.split("/").filter(Boolean);
 document.querySelectorAll("nav a.link").forEach(function(a){
   a.classList.toggle("active",a.getAttribute("href").replace("#","")===("/"+(parts[0]||"")));});
 var v=parts[0]||"";
 if(v==="")viewHome(r.q);
 else if(v==="gig")viewGig(parts[1]);
 else if(v==="post")viewPost();
 else if(v==="book")viewBook(parts[1]);
 else if(v==="dashboard")viewDashboard();
 else if(v==="bookings")viewBookings();
 else app.innerHTML='<div class="wrap page"><h2>Page not found</h2><a class="btn primary" href="#/">Back to gigs</a></div>';
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------------- components ---------------- */
function gigCard(g){return '<article class="card gig">'+
 '<div class="top"><span class="cat">'+esc(g.category)+'</span><span class="rate mono">$'+g.rate+' <small>/ '+esc(g.rateUnit)+'</small></span></div>'+
 '<h3>'+esc(g.title)+'</h3>'+
 '<div class="creator"><span class="av">'+esc(initials(g.creator))+'</span>'+esc(g.creator)+'</div>'+
 '<p class="desc">'+esc(g.description.slice(0,110))+(g.description.length>110?'…':'')+'</p>'+
 '<div class="btnrow"><a class="btn grow" href="#/gig/'+g.id+'">View</a><a class="btn primary grow" href="#/book/'+g.id+'">Book</a></div></article>';}
function badge(s){return '<span class="badge '+s+'"><i></i>'+s+'</span>';}

/* ---------------- views ---------------- */
function viewHome(q){
 var cat=q.category||"", term=q.q||"";
 var pend=data.bookings.filter(function(b){return b.status==="Pending";}).length;
 app.innerHTML='<div class="wrap hero"><h1>Turn your skills into opportunities.</h1>'+
 '<p>Discover creators. Book skills. Make things happen.</p>'+
 '<div class="stats"><div class="stat"><b class="mono">'+data.gigs.length+'</b>live gigs</div>'+
 '<div class="stat"><b class="mono">'+data.bookings.length+'</b>bookings made</div>'+
 '<div class="stat"><b class="mono">'+pend+'</b>awaiting reply</div></div>'+
 '<div class="toolbar"><input id="search" placeholder="Search gigs, creators, skills…" value="'+esc(term)+'" /></div>'+
 '<div class="chips" id="chips"></div></div>'+
 '<div class="wrap"><div class="grid" id="grid"></div></div>';
 var chips=document.getElementById("chips");
 chips.innerHTML=['All'].concat(CATEGORIES).map(function(c){
   var val=c==="All"?"":c;
   return '<button class="chip'+(val===cat?" active":"")+'" data-c="'+esc(val)+'">'+c+'</button>';}).join("");
 chips.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;
   var s=document.getElementById("search").value;
   go("/?category="+encodeURIComponent(b.dataset.c)+"&q="+encodeURIComponent(s));});
 var si=document.getElementById("search");
 si.addEventListener("input",function(){draw(si.value);});
 function draw(t){
   t=(t||"").toLowerCase();
   var list=newestFirst(data.gigs).filter(function(g){
     if(cat&&g.category!==cat)return false;
     if(!t)return true;
     return (g.title+" "+g.creator+" "+g.category+" "+g.description).toLowerCase().indexOf(t)>-1;});
   document.getElementById("grid").innerHTML=list.length?list.map(gigCard).join(""):
     '<div class="card empty">No gigs match that search yet. Try another word or clear the category filter.</div>';
 }
 draw(term);
}

function viewGig(id){
 var g=gigById(id);
 if(!g){app.innerHTML='<div class="wrap page"><h2>This gig is no longer listed</h2><p class="sub">It may have been removed.</p><a class="btn primary" href="#/">Browse all gigs</a></div>';return;}
 var similar=newestFirst(data.gigs).filter(function(x){return x.category===g.category&&x.id!==g.id;}).slice(0,3);
 app.innerHTML='<div class="wrap page"><a class="meta" href="#/">← Back to gigs</a>'+
 '<div class="card detail" style="margin-top:14px"><span class="cat" style="justify-self:start">'+esc(g.category)+'</span>'+
 '<h2>'+esc(g.title)+'</h2>'+
 '<div class="facts"><div class="fact"><span>Creator</span><b>'+esc(g.creator)+'</b></div>'+
 '<div class="fact"><span>Rate</span><b class="mono">$'+g.rate+' / '+esc(g.rateUnit)+'</b></div>'+
 '<div class="fact"><span>Category</span><b>'+esc(g.category)+'</b></div>'+
 '<div class="fact"><span>Posted</span><b>'+fmt(g.createdAt)+'</b></div></div>'+
 '<p class="desc" style="font-size:15.5px">'+esc(g.description)+'</p>'+
 '<a class="btn primary" style="justify-self:start" href="#/book/'+g.id+'">Book This Gig</a></div>'+
 (similar.length?'<h3 style="margin:34px 0 14px">More in '+esc(g.category)+'</h3><div class="grid">'+similar.map(gigCard).join("")+'</div>':'')+
 '</div>';
}

function viewPost(){
 app.innerHTML='<div class="wrap page"><h2>Post a Gig</h2><p class="sub">Share what you do best. Your gig appears at the top of the marketplace.</p>'+
 '<form class="card form" id="f" novalidate>'+
 '<div class="two"><div><label>Gig title</label><input name="title" placeholder="e.g. Thumbnail design that gets clicks" /><div class="err" data-e="title"></div></div>'+
 '<div><label>Your name</label><input name="creator" placeholder="e.g. Priya Kumari" /><div class="err" data-e="creator"></div></div></div>'+
 '<div class="two"><div><label>Category</label><select name="category"><option value="">Choose a category</option>'+CATEGORIES.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select><div class="err" data-e="category"></div></div>'+
 '<div><label>Rate (USD)</label><input name="rate" type="number" min="1" placeholder="120" /><div class="err" data-e="rate"></div></div></div>'+
 '<div><label>Rate unit</label><input name="rateUnit" placeholder="project, hour, session…" value="project" /></div>'+
 '<div><label>Description</label><textarea name="description" rows="5" placeholder="What is included, how you work, what the client receives (min 20 characters)."></textarea><div class="err" data-e="description"></div></div>'+
 '<button class="btn primary" type="submit">Publish gig</button></form></div>';
 document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();var f=e.target,v={},ok=true;
  ["title","creator","category","rate","rateUnit","description"].forEach(function(k){v[k]=f[k].value.trim();});
  f.querySelectorAll(".err").forEach(function(d){d.textContent="";});
  function bad(k,m){ok=false;f.querySelector('[data-e="'+k+'"]').textContent=m;}
  if(!v.title)bad("title","Please add a gig title.");
  if(!v.creator)bad("creator","Please add your name.");
  if(!v.category)bad("category","Please choose a category.");
  if(!(Number(v.rate)>0))bad("rate","Enter a rate greater than 0.");
  if(v.description.length<20)bad("description","Describe your gig in at least 20 characters.");
  if(!ok)return;
  var g={id:uid("g"),title:v.title,creator:v.creator,category:v.category,rate:Number(v.rate),rateUnit:v.rateUnit||"project",description:v.description,createdAt:Date.now()};
  data.gigs.unshift(g);save();go("/gig/"+g.id);
 });
}

function viewBook(id){
 var g=gigById(id);
 if(!g){app.innerHTML='<div class="wrap page"><h2>This gig is no longer listed</h2><a class="btn primary" href="#/">Browse all gigs</a></div>';return;}
 app.innerHTML='<div class="wrap page"><h2>Book: '+esc(g.title)+'</h2><p class="sub">'+esc(g.creator)+' · <span class="mono">$'+g.rate+' / '+esc(g.rateUnit)+'</span></p>'+
 '<form class="card form" id="bf" novalidate>'+
 '<div class="two"><div><label>Your name</label><input name="clientName" /><div class="err" data-e="clientName"></div></div>'+
 '<div><label>Email</label><input name="clientEmail" type="email" /><div class="err" data-e="clientEmail"></div></div></div>'+
 '<div><label>What do you need?</label><textarea name="requirement" rows="4" placeholder="Describe your project, deadline and anything the creator should know."></textarea><div class="err" data-e="requirement"></div></div>'+
 '<button class="btn primary" type="submit">Send booking request</button></form></div>';
 document.getElementById("bf").addEventListener("submit",function(e){
  e.preventDefault();var f=e.target,ok=true;
  var v={clientName:f.clientName.value.trim(),clientEmail:f.clientEmail.value.trim(),requirement:f.requirement.value.trim()};
  f.querySelectorAll(".err").forEach(function(d){d.textContent="";});
  function bad(k,m){ok=false;f.querySelector('[data-e="'+k+'"]').textContent=m;}
  if(!v.clientName)bad("clientName","Please add your name.");
  if(!/^\S+@\S+\.\S+$/.test(v.clientEmail))bad("clientEmail","Enter a valid email address.");
  if(v.requirement.length<10)bad("requirement","Tell the creator a little more (10+ characters).");
  if(!ok)return;
  data.bookings.unshift({id:uid("b"),gigId:g.id,clientName:v.clientName,clientEmail:v.clientEmail,requirement:v.requirement,status:"Pending",createdAt:Date.now()});
  save();
  app.innerHTML='<div class="wrap page" style="display:grid;justify-items:center"><div class="card ok"><div class="tick">✓</div>'+
   '<h2>Booking sent</h2><p class="sub">'+esc(g.creator)+' has your request for <b>'+esc(g.title)+'</b>. It is marked Pending until they reply.</p>'+
   '<div class="btnrow"><a class="btn primary" href="#/bookings">View My Bookings</a><a class="btn" href="#/">Keep browsing</a></div></div></div>';
 });
}

function viewDashboard(){
 var list=data.bookings.slice().sort(function(a,b){return b.createdAt-a.createdAt;});
 var p=list.filter(function(b){return b.status==="Pending";}).length;
 app.innerHTML='<div class="wrap page"><h2>Creator Dashboard</h2><p class="sub">'+list.length+' incoming bookings · '+p+' waiting on you.</p><div id="list"></div></div>';
 draw();
 function draw(){
  var el=document.getElementById("list");
  if(!list.length){el.innerHTML='<div class="card empty">No bookings yet. Share your gigs to get requests.</div>';return;}
  el.innerHTML=list.map(function(b){var g=gigById(b.gigId)||{title:"Removed gig",rate:0,rateUnit:"-"};
   return '<div class="card row"><div class="main"><h4>'+esc(g.title)+'</h4>'+
    '<div class="meta">'+esc(b.clientName)+' · '+esc(b.clientEmail)+'<br/><span class="mono">$'+g.rate+' / '+esc(g.rateUnit)+'</span> · '+fmt(b.createdAt)+'<br/>“'+esc(b.requirement)+'”</div></div>'+
    '<div style="display:grid;gap:10px;justify-items:end">'+badge(b.status)+
    (b.status==="Pending"?'<div class="btnrow"><button class="btn primary" data-a="Accepted" data-id="'+b.id+'">Accept</button><button class="btn danger" data-a="Declined" data-id="'+b.id+'">Decline</button></div>':'')+
    '</div></div>';}).join("");
  el.querySelectorAll("button[data-a]").forEach(function(btn){
   btn.addEventListener("click",function(){
    data.bookings.forEach(function(b){if(b.id===btn.dataset.id)b.status=btn.dataset.a;});
    save();list=data.bookings.slice().sort(function(a,b){return b.createdAt-a.createdAt;});draw();});});
 }
}

function viewBookings(){
 var list=data.bookings.slice().sort(function(a,b){return b.createdAt-a.createdAt;});
 app.innerHTML='<div class="wrap page"><h2>My Bookings</h2><p class="sub">Track every request and its status.</p>'+
 (list.length?list.map(function(b){var g=gigById(b.gigId)||{title:"Removed gig",creator:"—",rate:0,rateUnit:"-",category:""};
  return '<div class="card row"><div class="main"><h4>'+esc(g.title)+'</h4>'+
   '<div class="meta">'+esc(g.creator)+' · <span class="mono">$'+g.rate+' / '+esc(g.rateUnit)+'</span><br/>Booked '+fmt(b.createdAt)+'<br/>“'+esc(b.requirement)+'”'+
   (b.status==="Declined"?'<br/><span style="color:var(--dec-fg)">This creator could not take the job — here are similar gigs.</span>':'')+'</div></div>'+
   '<div style="display:grid;gap:10px;justify-items:end">'+badge(b.status)+
   (b.status==="Declined"?'<a class="btn primary" href="#/?category='+encodeURIComponent(g.category)+'">Find Similar Gigs</a>':'')+
   '</div></div>';}).join("")
  :'<div class="card empty">You have not booked anything yet. <a href="#/" style="color:var(--accent);font-weight:600">Explore gigs</a></div>')+
 '</div>';
}

render();
</script>
